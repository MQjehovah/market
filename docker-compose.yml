version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: market-db
    environment:
      - POSTGRES_USER=${MARKET_PG_USER:-market}
      - POSTGRES_PASSWORD=${MARKET_PG_PASSWORD:?MARKET_PG_PASSWORD is required}
      - POSTGRES_DB=${MARKET_PG_DB:-marketplace}
    ports:
      - "5434:5432"
    volumes:
      - market_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_PG_USER:-market} -d ${MARKET_PG_DB:-marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  market:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market
    ports:
      - "8093:8093"
    volumes:
      - ./data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - ROOT_PATH=/market
      - PORT=8093
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      - SEED_PUBLISHER_PASSWORD=${SEED_PUBLISHER_PASSWORD:?SEED_PUBLISHER_PASSWORD is required}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:?SEED_USER_PASSWORD is required}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/marketplace.db}
      - ARTIFACT_STORAGE=${ARTIFACT_STORAGE:-local}
      - ARTIFACT_DIR=${ARTIFACT_DIR:-./data/artifacts}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - AGENT_MAX_ITERATIONS=${AGENT_MAX_ITERATIONS:-10}
      - RUNTIME_ACCESS_ROLES=${RUNTIME_ACCESS_ROLES:-admin}
      # 多 worker 水平扩展(默认 1); 网关 MCP 流式会话无状态(默认 1=开, 多 worker 必需)
      - WORKERS=${WORKERS:-1}
      - MCP_GATEWAY_STATELESS=${MCP_GATEWAY_STATELESS:-1}
      # 安全灰度: 出网白名单(防 SSRF) 与 scope 收窄(默认关; 见 README/docs)
      - MCP_EGRESS_ENFORCE=${MCP_EGRESS_ENFORCE:-}
      - MCP_EGRESS_ALLOW_HOSTS=${MCP_EGRESS_ALLOW_HOSTS:-}
      - MCP_EGRESS_ALLOWLIST_ONLY=${MCP_EGRESS_ALLOWLIST_ONLY:-}
      - MARKET_SCOPE_ENFORCE=${MARKET_SCOPE_ENFORCE:-}
      - SSO_ISSUER=${SSO_ISSUER:-http://192.168.31.45:8091}
      - SSO_AUDIENCE=${SSO_AUDIENCE:-market}
      - SSO_JWKS_URI=${SSO_JWKS_URI:-http://192.168.31.45:8091/.well-known/jwks.json}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-market}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI:-http://192.168.31.34:8093/api/auth/oidc/callback}
      - SSO_REDIRECT_TARGET=${SSO_REDIRECT_TARGET:-/login}
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8093 --root-path /market --proxy-headers --forwarded-allow-ips=* --workers ${WORKERS:-1}"]
    restart: unless-stopped

volumes:
  market_pgdata:
